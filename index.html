<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Vault — The Endless Descent</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="game-container">
  <header class="vault-brand"><div class="brand-emblem">◆</div><div><h1>OBSIDIAN <span>VAULT</span></h1><p>THE ENDLESS DESCENT</p></div><div class="brand-rune">✦</div></header>
  <!-- HUD -->
  <div id="hud">
    <div id="hud-identity" class="hero-identity">Adventurer · Lv 1</div>
    <div class="hud-row">
      <span class="hud-label">♥ HEALTH</span>
      <div class="hp-bar-container"><div class="hp-bar-outer"><div id="hp-bar" class="hp-bar-inner" style="width:100%"></div></div><span id="hp-text" class="hp-text">100 / 100</span></div>
    </div>
    <div class="hud-row">
      <span class="hud-label">✦ EXPERIENCE</span>
      <div class="xp-bar-container"><div class="xp-bar-outer"><div id="xp-bar" class="xp-bar-inner" style="width:0%"></div></div><span id="xp-text" class="xp-text">0 / 65</span></div>
    </div>
    <div id="hud-stats" class="stat-grid"></div>
    <nav class="panel-nav" aria-label="Character management"><button id="character-button" class="btn" onclick="openPanel('character')">Character</button><button id="inventory-button" class="btn" onclick="openPanel('inventory')">Inventory & Equipment</button></nav>
  </div>

  <!-- Floor/Room Indicator -->
  <div id="floor-indicator"><div class="floor-kicker">✦ &nbsp; THE DESCENT &nbsp; ✦</div>
    <span id="floor-room-text">Floor 1 • Room 1/10</span>
    <div id="room-dots" class="room-dots"></div>
  </div>

  <!-- Main Content Area -->
  <div id="main-area"></div>

  <!-- Text Log -->
  <div class="log-heading"><span>◈ &nbsp; ADVENTURE JOURNAL</span><span class="log-live">● LIVE</span></div><div id="log-area" role="log" aria-live="polite"></div>
</div>

<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="modal-box" id="management-panel"></div></div>

<script src="js/systems.js" defer></script>
<script src="js/game.js" defer></script>
</body>
</html>
